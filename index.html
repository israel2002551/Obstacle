<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"/>
<title>ESP32 MQTT Explorer</title>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link href="https://fonts.googleapis.com/css2?family=Space+Mono:wght@400;700&family=DM+Sans:wght@300;400;500;600&display=swap" rel="stylesheet"/>
<style>
  :root {
    --bg: #0b0c10;
    --surface: #12141a;
    --surface2: #1c1f2a;
    --border: rgba(255,255,255,0.07);
    --border-hi: rgba(255,255,255,0.15);
    --accent: #00e5ff;
    --accent-dim: rgba(0,229,255,0.12);
    --accent-glow: rgba(0,229,255,0.35);
    --danger: #ff4d6d;
    --danger-dim: rgba(255,77,109,0.15);
    --success: #00c896;
    --warn: #ffb300;
    --text: #e8eaf0;
    --muted: #5a5f72;
    --mono: 'Space Mono', monospace;
    --sans: 'DM Sans', system-ui, sans-serif;
  }

  *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    background: var(--bg);
    color: var(--text);
    font-family: var(--sans);
    min-height: 100vh;
    display: grid;
    grid-template-rows: auto 1fr auto;
    overflow-x: hidden;
  }

  body::before {
    content: "";
    position: fixed;
    inset: 0;
    background-image:
      linear-gradient(rgba(0,229,255,0.025) 1px, transparent 1px),
      linear-gradient(90deg, rgba(0,229,255,0.025) 1px, transparent 1px);
    background-size: 40px 40px;
    pointer-events: none;
    z-index: 0;
  }

  header {
    position: relative;
    z-index: 10;
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 14px 24px;
    border-bottom: 1px solid var(--border);
    background: rgba(11,12,16,0.9);
    backdrop-filter: blur(12px);
    gap: 16px;
    flex-wrap: wrap;
  }

  .logo {
    font-family: var(--mono);
    font-size: 1rem;
    font-weight: 700;
    letter-spacing: 0.04em;
    color: var(--accent);
    display: flex;
    align-items: center;
    gap: 10px;
  }

  .logo-icon {
    width: 32px; height: 32px;
    background: var(--accent-dim);
    border: 1px solid rgba(0,229,255,0.3);
    border-radius: 8px;
    display: flex; align-items: center; justify-content: center;
    font-size: 1rem;
  }

  .logo-label { color: var(--text); }
  .logo-label span { color: var(--accent); }

  .status-pill {
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 6px 14px;
    background: var(--surface2);
    border: 1px solid var(--border-hi);
    border-radius: 999px;
    font-family: var(--mono);
    font-size: 0.72rem;
    letter-spacing: 0.06em;
    user-select: none;
  }

  .status-pill.connected { border-color: rgba(0,200,150,0.4); }

  .dot {
    width: 8px; height: 8px;
    border-radius: 50%;
    background: var(--danger);
    flex-shrink: 0;
  }

  .dot.live {
    background: var(--success);
    box-shadow: 0 0 0 3px rgba(0,200,150,0.25);
    animation: throb 2s ease-in-out infinite;
  }

  @keyframes throb {
    0%,100% { box-shadow: 0 0 0 3px rgba(0,200,150,0.25); }
    50%      { box-shadow: 0 0 0 5px rgba(0,200,150,0.1); }
  }

  main {
    position: relative;
    z-index: 5;
    display: grid;
    grid-template-columns: 1fr 340px;
    max-height: calc(100vh - 57px - 44px);
  }

  .console-panel {
    padding: 24px;
    display: flex;
    flex-direction: column;
    gap: 16px;
    border-right: 1px solid var(--border);
    background: rgba(18, 20, 26, 0.4);
  }

  .console-log {
    flex: 1;
    background: #000;
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 16px;
    font-family: var(--mono);
    font-size: 0.85rem;
    color: #00ffaa;
    overflow-y: auto;
    box-shadow: inset 0 0 20px rgba(0,0,0,0.8);
  }

  .console-line {
    margin-bottom: 6px;
    line-height: 1.4;
  }
  .console-line span { color: var(--muted); }

  .sidebar {
    display: flex;
    flex-direction: column;
    overflow-y: auto;
  }

  .panel {
    padding: 20px;
    border-bottom: 1px solid var(--border);
  }

  .panel-title {
    font-family: var(--mono);
    font-size: 0.7rem;
    letter-spacing: 0.1em;
    color: var(--muted);
    text-transform: uppercase;
    margin-bottom: 16px;
    display: flex;
    align-items: center;
    gap: 8px;
  }

  .panel-title::before {
    content: "";
    display: block;
    width: 3px;
    height: 12px;
    background: var(--accent);
    border-radius: 2px;
  }

  .dpad {
    display: grid;
    grid-template-columns: repeat(3, 60px);
    grid-template-rows: repeat(3, 60px);
    gap: 8px;
    margin: 0 auto;
    width: fit-content;
  }

  .dpad-btn {
    width: 60px; height: 60px;
    background: var(--surface2);
    border: 1px solid var(--border-hi);
    border-radius: 12px;
    color: var(--text);
    font-size: 1.1rem;
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    user-select: none;
    touch-action: manipulation;
    transition: background 0.1s, border-color 0.1s, transform 0.1s;
  }

  .dpad-btn:hover { background: rgba(0,229,255,0.07); border-color: rgba(0,229,255,0.25); }
  .dpad-btn.pressed { background: var(--accent-dim); border-color: var(--accent); transform: scale(0.95); }
  .dpad-btn.stop-btn { background: rgba(255,77,109,0.08); border-color: rgba(255,77,109,0.25); }
  .dpad-btn.stop-btn:hover { background: rgba(255,77,109,0.15); border-color: rgba(255,77,109,0.5); }
  .dpad-btn.stop-btn.pressed { background: var(--danger-dim); border-color: var(--danger); }

  .phantom { visibility: hidden; pointer-events: none; }

  .slider-row {
    display: flex;
    align-items: center;
    gap: 12px;
    margin-top: 16px;
  }

  .slider-label {
    font-family: var(--mono);
    font-size: 0.72rem;
    color: var(--muted);
    width: 46px;
  }

  input[type="range"] {
    flex: 1;
    -webkit-appearance: none;
    height: 4px;
    background: var(--surface2);
    border: 1px solid var(--border-hi);
    border-radius: 4px;
    outline: none;
    cursor: pointer;
  }

  input[type="range"]::-webkit-slider-thumb {
    -webkit-appearance: none;
    width: 16px; height: 16px;
    border-radius: 50%;
    background: var(--accent);
    border: 2px solid var(--bg);
    transition: transform 0.1s;
  }

  input[type="range"]::-webkit-slider-thumb:hover { transform: scale(1.2); }

  .slider-val {
    font-family: var(--mono);
    font-size: 0.72rem;
    color: var(--accent);
    width: 32px;
    text-align: right;
  }

  .mode-grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 10px;
  }

  .mode-btn {
    padding: 14px 12px;
    border-radius: 12px;
    border: 1px solid;
    font-family: var(--mono);
    font-size: 0.7rem;
    letter-spacing: 0.06em;
    cursor: pointer;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 6px;
    transition: all 0.2s;
  }

  .mode-btn:active { transform: scale(0.97); }
  .mode-btn .mode-icon { font-size: 1.4rem; }

  .mode-btn.auto-btn { background: var(--accent-dim); border-color: rgba(0,229,255,0.3); color: var(--accent); }
  .mode-btn.auto-btn.active-mode { background: var(--accent); color: #000; border-color: var(--accent); box-shadow: 0 0 24px var(--accent-glow); }
  .mode-btn.manual-btn { background: rgba(255,179,0,0.07); border-color: rgba(255,179,0,0.25); color: var(--warn); }
  .mode-btn.manual-btn.active-mode { background: var(--warn); color: #000; border-color: var(--warn); }

  .cam-btns { display: flex; gap: 8px; justify-content: center; }
  .cam-btn {
    flex: 1; padding: 12px 8px; background: var(--surface2); border: 1px solid var(--border-hi);
    border-radius: 10px; color: var(--text); font-family: var(--mono); font-size: 0.65rem;
    cursor: pointer; display: flex; flex-direction: column; align-items: center; gap: 5px;
  }
  .cam-btn:hover { background: rgba(0,229,255,0.07); border-color: rgba(0,229,255,0.3); }
  .cam-btn.pressed { background: var(--accent-dim); border-color: var(--accent); transform: scale(0.95); }
  .cam-center { flex: none; width: 44px; height: 44px; border-radius: 50%; justify-content: center; align-self: center; }

  footer {
    position: relative; z-index: 10; display: flex; align-items: center; justify-content: space-between;
    padding: 8px 24px; background: rgba(11,12,16,0.9); border-top: 1px solid var(--border);
    backdrop-filter: blur(12px); font-family: var(--mono); font-size: 0.68rem; color: var(--muted);
  }

  #keyHint kbd {
    display: inline-flex; background: var(--surface2); border: 1px solid var(--border-hi);
    border-radius: 4px; padding: 1px 5px; color: var(--text); margin: 0 2px;
  }

  .toast-zone { position: fixed; bottom: 52px; right: 16px; z-index: 900; display: flex; flex-direction: column-reverse; gap: 8px; }
  .toast {
    background: var(--surface); border: 1px solid var(--border-hi); border-radius: 10px; padding: 10px 14px;
    font-family: var(--mono); font-size: 0.75rem; color: var(--text); display: flex; align-items: center; gap: 8px;
    animation: toastIn 0.25s ease-out, toastOut 0.3s ease-in 2.7s forwards; max-width: 280px;
  }
  .toast.ok { border-left: 3px solid var(--success); }
  .toast.info { border-left: 3px solid var(--accent); }

  @media (max-width: 700px) {
    main { grid-template-columns: 1fr; grid-template-rows: 240px 1fr; max-height: none; }
    .console-panel { border-right: none; border-bottom: 1px solid var(--border); }
    .sidebar { flex-direction: column; }
    footer #keyHint { display: none; }
  }
</style>
<script src="https://cdnjs.cloudflare.com/ajax/libs/paho-mqtt/1.0.1/mqttws31.min.js" type="text/javascript"></script>
</head>
<body>

<header>
  <div class="logo">
    <div class="logo-icon">🤖</div>
    <div class="logo-label">EXPLORER<span>-MQTT</span></div>
  </div>

  <div class="status-pill" id="statusPill">
    <div class="dot" id="dot"></div>
    <span id="statusText">CONNECTING</span>
  </div>
</header>

<main>
  <div class="console-panel">
    <div class="panel-title" style="margin-bottom:0px">Live Robot Status Logs</div>
    <div class="console-log" id="consoleLog">
      <div class="console-line"><span>[SYSTEM]</span> Initializing system core dashboard...</div>
    </div>
  </div>

  <div class="sidebar">
    <div class="panel">
      <div class="panel-title">Drive Matrix</div>
      <div class="dpad">
        <div class="phantom dpad-btn"></div>
        <button class="dpad-btn" id="btn-forward">▲</button>
        <div class="phantom dpad-btn"></div>
        <button class="dpad-btn" id="btn-left">◀</button>
        <button class="dpad-btn stop-btn" id="btn-stop">■</button>
        <button class="dpad-btn" id="btn-right">▶</button>
        <div class="phantom dpad-btn"></div>
        <button class="dpad-btn" id="btn-backward">▼</button>
        <div class="phantom dpad-btn"></div>
      </div>

      <div class="slider-row">
        <span class="slider-label">SPEED</span>
        <input type="range" id="speedSlider" min="1" max="5" step="1" value="3"/>
        <span class="slider-val" id="speedVal">3</span>
      </div>
    </div>

    <div class="panel">
      <div class="panel-title">Sonar Mount Pan</div>
      <div class="cam-btns">
        <button class="cam-btn" id="btn-camleft">
          <span class="cam-icon">◀</span><span>LEFT</span>
        </button>
        <button class="cam-btn cam-center" id="btn-camcenter">⏺</button>
        <button class="cam-btn" id="btn-camright">
          <span class="cam-icon">▶</span><span>RIGHT</span>
        </button>
      </div>
    </div>

    <div class="panel">
      <div class="panel-title">Navigation Core Mode</div>
      <div class="mode-grid">
        <button class="mode-btn auto-btn" id="btn-auto" onclick="setMode('auto')">
          <span class="mode-icon">🤖</span>AUTO
        </button>
        <button class="mode-btn manual-btn" id="btn-manual" onclick="setMode('manual')">
          <span class="mode-icon">🕹</span>MANUAL
        </button>
      </div>
    </div>
  </div>
</main>

<footer>
  <div>MQTT BROKER: broker.emqx.io (WebSockets Port 8084)</div>
  <div id="keyHint">
    <kbd>W</kbd><kbd>A</kbd><kbd>S</kbd><kbd>D</kbd> drive &nbsp;|&nbsp;
    <kbd>Space</kbd> stop &nbsp;|&nbsp;
    <kbd>Q</kbd><kbd>E</kbd> pan sonar
  </div>
</footer>

<div class="toast-zone" id="toastZone"></div>

<script>
/* ── MQTT EMQX ROUTING CONFIGURATION ── */
const brokerHost = "broker.emqx.io";
const brokerPort = 8084; 
const clientID = "web_dashboard_" + Math.random().toString(16).substring(2, 10);

const topicCmd = "robot/explorer/cmd";
const topicStatus = "robot/explorer/status";

let mqttClient = null;
let activeKeys = new Set();
let currentMode = 'manual';

const dot = document.getElementById('dot');
const statusText = document.getElementById('statusText');
const statusPill = document.getElementById('statusPill');
const consoleLog = document.getElementById('consoleLog');
const speedSlider = document.getElementById('speedSlider');
const speedVal = document.getElementById('speedVal');
const toastZone = document.getElementById('toastZone');

document.addEventListener('DOMContentLoaded', () => {
  initMQTT();
  initDPad();
  initCamBtns();
  initSpeedSlider();
  initKeyboard();
  setMode('manual');
});

function initMQTT() {
  // FIXED: Explicit /mqtt path parameter connects flawlessly to the gateway structure
  mqttClient = new Paho.MQTT.Client(brokerHost, Number(brokerPort), "/mqtt", clientID);
  
  mqttClient.onConnectionLost = (responseObject) => {
    dot.classList.remove('live');
    statusText.textContent = "OFFLINE";
    logMsg("SYSTEM", "Broker connection dropped. Retrying...", true);
    setTimeout(initMQTT, 3000);
  };

  mqttClient.onMessageArrived = (message) => {
    if(message.destinationName === topicStatus) {
      logMsg("ROBOT", message.payloadString);
    }
  };

  const options = {
    useSSL: true,
    timeout: 10,                 // Elevated handshaking threshold
    mqttVersion: 4,              // Standardizes connection over framed web channels
    cleanSession: true,
    onSuccess: () => {
      dot.classList.add('live');
      statusText.textContent = "ONLINE";
      logMsg("SYSTEM", "Connected to EMQX Broker successfully.");
      mqttClient.subscribe(topicStatus);
      toast("Connected to Dashboard Grid", "ok");
    },
    onFailure: (message) => {
      logMsg("SYSTEM", "Connection Failed: " + message.errorMessage, true);
      setTimeout(initMQTT, 5000);
    }
  };

  mqttClient.connect(options);
}

function sendCmd(cmd) {
  if (!mqttClient || !mqttClient.isConnected()) return;
  const message = new Paho.MQTT.Message(cmd);
  message.destinationName = topicCmd;
  mqttClient.send(message);
}

function logMsg(sender, text, isError = false) {
  const line = document.createElement('div');
  line.className = 'console-line';
  if (isError) line.style.color = 'var(--danger)';
  
  const time = new Date().toLocaleTimeString();
  line.innerHTML = `<span>[${time}] [${sender}]</span> ${text}`;
  consoleLog.appendChild(line);
  consoleLog.scrollTop = consoleLog.scrollHeight;
}

/* ── INTERFACE & SIGNAL PROCESSING ── */
const dpadMap = { 'btn-forward': 'forward', 'btn-backward': 'backward', 'btn-left': 'left', 'btn-right': 'right', 'btn-stop': 'stop' };
function initDPad() {
  Object.entries(dpadMap).forEach(([id, cmd]) => {
    const btn = document.getElementById(id);
    if (!btn) return;
    const isStop = cmd === 'stop';

    const press = () => { 
      if (btn._interval) return; 
      btn.classList.add('pressed'); 
      sendCmd(cmd); 
      if(!isStop) btn._interval = setInterval(() => sendCmd(cmd), 120); 
    };

    const release = () => { 
      btn.classList.remove('pressed'); 
      if (btn._interval) {
        clearInterval(btn._interval);
        btn._interval = null;
      }
      if(!isStop) sendCmd('stop'); 
    };

    btn.addEventListener('mousedown', press);
    btn.addEventListener('mouseup', release);
    btn.addEventListener('mouseleave', release);
    btn.addEventListener('touchstart', (e) => { e.preventDefault(); press(); }, { passive: false });
    btn.addEventListener('touchend', (e) => { e.preventDefault(); release(); }, { passive: false });
    btn.addEventListener('touchcancel', release);
  });
}

const camMap = { 'btn-camleft': { down: 'camleft', up: 'camstill' }, 'btn-camright': { down: 'camright', up: 'camstill' }, 'btn-camcenter': { tap: 'camcenter' } };
function initCamBtns() {
  Object.entries(camMap).forEach(([id, cfg]) => {
    const btn = document.getElementById(id);
    if (!btn) return;
    if (cfg.tap) { btn.addEventListener('click', () => sendCmd(cfg.tap)); return; }

    const press = () => { btn.classList.add('pressed'); sendCmd(cfg.down); };
    const release = () => { btn.classList.remove('pressed'); sendCmd(cfg.up); };

    btn.addEventListener('mousedown', press);
    btn.addEventListener('mouseup', release);
    btn.addEventListener('mouseleave', release);
    btn.addEventListener('touchstart', (e) => { e.preventDefault(); press(); }, { passive: false });
    btn.addEventListener('touchend', (e) => { e.preventDefault(); release(); }, { passive: false });
  });
}

function initSpeedSlider() {
  speedSlider.addEventListener('input', () => {
    speedVal.textContent = speedSlider.value;
    sendCmd('speed:' + speedSlider.value);
  });
}

function setMode(mode) {
  currentMode = mode;
  document.getElementById('btn-auto').classList.toggle('active-mode', mode === 'auto');
  document.getElementById('btn-manual').classList.toggle('active-mode', mode === 'manual');
  sendCmd(mode);
}

const keyCmd = {
  ArrowUp: 'forward', w: 'forward', W: 'forward',
  ArrowDown: 'backward', s: 'backward', S: 'backward',
  ArrowLeft: 'left', a: 'left', A: 'left',
  ArrowRight: 'right', d: 'right', D: 'right',
  ' ': 'stop',
  q: 'camleft', Q: 'camleft',
  e: 'camright', E: 'camright',
  c: 'camcenter', C: 'camcenter'
};
const moveKeys = new Set(['ArrowUp','ArrowDown','ArrowLeft','ArrowRight','w','a','s','d','W','A','S','D']);
const camKeys = new Set(['q','e','Q','E']);

function initKeyboard() {
  document.addEventListener('keydown', (ev) => {
    const cmd = keyCmd[ev.key];
    if (!cmd || activeKeys.has(ev.key)) return;
    ev.preventDefault();
    activeKeys.add(ev.key);
    sendCmd(cmd);

    const btnId = btnForKey(ev.key);
    if (btnId) document.getElementById(btnId)?.classList.add('pressed');
  });

  document.addEventListener('keyup', (ev) => {
    if (!activeKeys.has(ev.key)) return;
    activeKeys.delete(ev.key);

    const btnId = btnForKey(ev.key);
    if (btnId) document.getElementById(btnId)?.classList.remove('pressed');

    if (moveKeys.has(ev.key)) {
      if (![...activeKeys].some(k => moveKeys.has(k))) sendCmd('stop');
    }
    if (camKeys.has(ev.key)) sendCmd('camstill');
  });
}

function btnForKey(k) {
  if (k === 'ArrowUp'    || k === 'w' || k === 'W') return 'btn-forward';
  if (k === 'ArrowDown'  || k === 's' || k === 'S') return 'btn-backward';
  if (k === 'ArrowLeft'  || k === 'a' || k === 'A') return 'btn-left';
  if (k === 'ArrowRight' || k === 'd' || k === 'D') return 'btn-right';
  if (k === ' ')                                      return 'btn-stop';
  if (k === 'q' || k === 'Q')                        return 'btn-camleft';
  if (k === 'e' || k === 'E')                        return 'btn-camright';
  return null;
}

function toast(msg, type = 'info') {
  const el = document.createElement('div');
  el.className = `toast ${type}`;
  el.textContent = msg;
  toastZone.appendChild(el);
  setTimeout(() => el.remove(), 3000);
}

document.querySelectorAll('button').forEach(b => {
  b.addEventListener('contextmenu', e => e.preventDefault());
});
</script>
</body>
</html>
